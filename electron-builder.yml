appId: dev.cubex.harness
productName: Cubex
copyright: Copyright © 2026 HeshamXOR
publish: null
directories:
  output: release
  buildResources: resources
files:
  - out/main/**/*
  - out/preload/**/*
  - out/renderer/**/*
  - resources/**/*
  - "!resources/skills/**/*"
  - "!resources/logo-source.webp"
  - "!resources/icon.ico"
  - agent-skills-library/skills/**/*
  - agent-skills-library/LICENSE
  - agent-skills-library/README.md
  - agent-skills-library/index.json
  - package.json
asarUnpack:
  - "**/*.node"
npmRebuild: true
# resources/icon.png is the 1254x1254 Cubex mark. resources/icon.ico is the multi-size Windows icon cut from it.
# Builds are unsigned: with no certificate configured electron-builder skips signing and still stamps the icon and
# version info onto the executable.
win:
  target:
    - target: nsis
      arch: [x64]
  icon: resources/icon.ico
nsis:
  artifactName: Cubex-Setup-${version}.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
linux:
  target:
    - AppImage
    - deb
  category: Development
  icon: resources/icon.png
  maintainer: Cubex
mac:
  target:
    - target: dmg
      arch: [x64, arm64]
  category: public.app-category.developer-tools
  icon: resources/icon.png
